[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-mix-vlm"
version = "0.1.0"
description = "Fluid-inspired liquid neural fusion for lightweight VLM image-text matching experiments."
requires-python = ">=3.10"
dependencies = [
  "datasets",
  "matplotlib",
  "numpy",
  "pandas",
  "peft",
  "Pillow",
  "pypandoc_binary",
  "pyyaml",
  "scikit-learn",
  "scipy",
  "torch",
  "torchvision",
  "tqdm",
  "transformers",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
