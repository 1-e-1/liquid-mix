dataset:
  name: coco2014-1k
  source: coco2014_zip
  image_zip: MS COCO 2014.zip
  annotation_zip: MS COCO Captions.zip
  processed_dir: data/processed/coco2014_1k
  train_limit: 5000
  val_limit: 1000
  test_limit: 1000
  seed: 42
  use_5k_part: true

model:
  seed: 13
  image_size: 96
  max_vocab: 8000
  min_freq: 1
  max_len: 32
  hidden_dim: 128
  field_grid: 4
  text_layers: 2
  text_heads: 4
  dropout: 0.1
  steps: 4
  dt: 0.2
  diffusion: 0.03
  reaction: 0.5
  num_heads: 4

training:
  device: auto
  epochs: 40
  batch_size: 48
  lr: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  contrastive_weight: 1.0
  contrastive_temperature: 0.07
  itm_weight: 0.5
  hard_negatives_per_positive: 3
  negative_offset: 17
  pair_chunk_size: 2048
  patience: 12
  clip_summary: results/q1_complete_ablation/coco1k/clip_adapters/summary.csv
