dataset:
  name: flickr30k-large-local
  source: flickr30k_zip
  archive: Flickr30k_Dataset.zip
  processed_dir: data/processed/flickr30k_large
  train_limit: 10000
  val_limit: 1000
  test_limit: 1000
  seed: 42

clip:
  model_name: openai/clip-vit-base-patch32
  local_files_only: true
  batch_size: 64

adapter:
  methods:
    - residual_fluidmix
  epochs: 20
  batch_size: 128
  lr: 0.0003
  weight_decay: 0.0001
  hidden_dim: 128
  field_grid: 4
  steps: 4
  dt: 0.2
  diffusion: 0.03
  reaction: 0.5
  num_heads: 4
  seed: 13
  device: auto
  negative_offset: 17
  gradient_clip: 1.0
  clip_scale: 1.0
  contrastive_weight: 0.0
  contrastive_temperature: 0.07
  contrastive_batch_size: 16
  hard_negatives_per_positive: 0
