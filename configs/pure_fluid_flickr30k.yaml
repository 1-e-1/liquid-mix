dataset:
  name: flickr30k-local
  source: flickr30k_zip
  archive: Flickr30k_Dataset.zip
  processed_dir: data/processed/flickr30k
  train_limit: 1000
  val_limit: 200
  test_limit: 200
  seed: 42

model:
  seed: 13
  image_size: 96
  max_vocab: 4000
  min_freq: 1
  max_len: 32
  hidden_dim: 128
  field_grid: 4
  text_layers: 2
  text_heads: 4
  dropout: 0.1
  steps: 4
  dt: 0.2
  diffusion: 0.03
  reaction: 0.5
  num_heads: 4

training:
  device: auto
  epochs: 60
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  contrastive_weight: 1.0
  contrastive_temperature: 0.07
  itm_weight: 0.5
  hard_negatives_per_positive: 3
  negative_offset: 17
  pair_chunk_size: 1024
  patience: 18
  clip_summary: results/clip_vlm_flickr30k/summary.csv
